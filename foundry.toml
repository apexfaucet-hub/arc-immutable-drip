[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
cache_path = "contracts/cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
# Read-only access to the compiled artifacts of the default profile, nothing else.
fs_permissions = [{ access = "read", path = "contracts/out" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 100
fail_on_revert = false

# Deliberately faulty copies (P1-P5). Never part of the default profile.
# Separate src/test/out/cache so nothing here can touch contracts/out.
[profile.planted]
src = "planted"
test = "test-planted"
script = "planted"
out = "out-planted"
cache_path = "cache-planted"

[rpc_endpoints]
ethereum = "https://ethereum-rpc.publicnode.com"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
base = "https://base-rpc.publicnode.com"
base_sepolia = "https://base-sepolia-rpc.publicnode.com"
arbitrum = "https://arbitrum-one-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com"
optimism = "https://optimism-rpc.publicnode.com"
